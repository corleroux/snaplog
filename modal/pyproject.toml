[project]
name = "snaplog-modal"
version = "0.1.0"
description = "Snaplog Modal jobs: rack-walk video pipeline (SAM 3.1 orchestration)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "modal>=1.0",
  "supabase>=2.0",
  "opencv-python-headless>=4.0",
  "numpy>=1.26",
  "requests>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false
