name: Sync pc/staging

# Keeps the Pure-Collections/fair-app staging branch in lock-step with this
# repo's staging branch. Requires:
#   - Repo secret PC_PUSH_TOKEN: a PAT with Contents: Read/Write on
#     Pure-Collections/fair-app
#   - A self-hosted runner (label: pc-sync) — GitHub-hosted runners are blocked
#     by the Pure-Collections org network policy ("Repository not found")
# Skips silently when the secret is not configured.

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted
    env:
      PC_PUSH_TOKEN: ${{ secrets.PC_PUSH_TOKEN }}
    steps:
      - name: Check token configured
        id: config
        run: |
          if [ -z "$PC_PUSH_TOKEN" ]; then
            echo "PC_PUSH_TOKEN not set — skipping pc/staging sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout staging
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          # Do not persist the workflow GITHUB_TOKEN as an http extraheader —
          # it would override the PC_PUSH_TOKEN on all github.com requests
          # (including our push to Pure-Collections/fair-app).
          persist-credentials: false

      - name: Push staging to pc remote
        if: steps.config.outputs.enabled == 'true'
        run: |
          git config user.name "staging-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          # Runner workspace persists between runs — add or update the remote
          PC_URL="https://corleroux:${PC_PUSH_TOKEN}@github.com/Pure-Collections/fair-app.git"
          git remote add pc "$PC_URL" 2>/dev/null || git remote set-url pc "$PC_URL"
          git push pc origin/staging:refs/heads/staging
