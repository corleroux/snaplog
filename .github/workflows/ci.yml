name: CI

# DISABLED (2026-10-30): all CI is outdated and turned off until it is rebuilt.
# To re-enable, restore the `on:` triggers below.
# on:
#   pull_request:
#     branches: [main, staging]
#   push:
#     branches: [main, staging]
#     tags:
#       - 'v*.*.*'
on: []

jobs:
  # ============================================================================
  # UNIT TESTS + LINT + TYPE CHECK + BUILD
  # ============================================================================
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --omit=dev

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      - name: Test with coverage thresholds
        run: pnpm test:run -- --coverage
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-key
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''

      - name: Build
        run: pnpm build

  # ============================================================================
  # MIGRATION LINT
  # Catches SQL syntax errors and references to non-existent tables/columns
  # without spinning up a full Supabase instance.
  # Upgrade to 'supabase start && supabase db push' post-launch (Option A).
  # ============================================================================
  migration-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lint SQL migrations
        run: supabase db lint --schema public

  # ============================================================================
  # E2E TESTS — Core journey specs only (@core tag).
  # Runs against the staging deployment using E2E_USER_EMAIL / E2E_USER_PASSWORD
  # secrets. Capture flow tests (vendor-capture, fabric-capture) require
  # GEMINI_API_KEY to be set; they will be skipped by Playwright if the Gemini
  # call fails — acceptable for now, flag in test results.
  #
  # Skipped specs (with reasons in each file):
  #   sharing, offline-draft, mobile-gestures, admin, analytics,
  #   notifications, error-handling
  # ============================================================================
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E core journey
        run: pnpm exec playwright test --grep "@core" --project=chromium
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # STAGING DEPLOY — on merge to main
  # ============================================================================
  deploy-staging:
    needs: [ci, migration-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Deploy to Vercel (Staging)
        id: deploy
        run: npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run smoke tests
        run: deno run --allow-net --allow-env scripts/smoke-test.ts ${{ secrets.STAGING_URL }}

  # ============================================================================
  # PRODUCTION DEPLOY — on version tag
  #
  # NOTE: The approval gate is enforced via the "production" GitHub Environment:
  #   Settings → Environments → production → Required reviewers
  # Both developers must be added as required reviewers there.
  # The environment block below scopes secrets; the approval gate is
  # configured separately by a repo admin.
  # ============================================================================
  deploy-production:
    needs: [ci, migration-check]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
