name: Validate Edge Function Docs

# DISABLED (2026-10-30): all CI is outdated and turned off until it is rebuilt.
# To re-enable, restore the `on:` triggers below.
# on:
#   push:
#     branches: [staging, main]
#   pull_request:
#     branches: [staging]
on: []

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check all edge functions are documented
        run: deno run --allow-read scripts/validate-edge-function-docs.ts
